services:
  # ── Frontend: Nuxt 3 (Node SSR) ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ifiruled-frontend-1
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_API_BASE_SERVER: http://ifiruled-backend:8000/api
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "127.0.0.1:3006:3000"
    networks:
      default:
        aliases:
          - ifiruled-frontend
      caddy_net:

  # ── Backend: Laravel API (Nginx + PHP-FPM) ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ifiruled-backend-1
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: https://ifiruled.world
      DB_CONNECTION: mysql
      DB_HOST: ifiruled-db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-if_i_ruled}
      DB_USERNAME: ${DB_USERNAME:-ifiruled_user}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@ifiruled.world}
      MAIL_FROM_NAME: "If I Ruled"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - backend-storage:/var/www/html/storage
    ports:
      - "127.0.0.1:8006:8000"
    networks:
      default:
        aliases:
          - ifiruled-backend
      caddy_net:
    depends_on:
      db:
        condition: service_healthy

  # ── Database: MySQL 8 ─────────────────────────────────────────────────────
  db:
    image: mysql:8
    container_name: ifiruled-db-1
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-if_i_ruled}
      MYSQL_USER: ${DB_USERNAME:-ifiruled_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      default:
        aliases:
          - ifiruled-db

volumes:
  backend-storage:
  db-data:

networks:
  default:
    name: ifiruled_default
  caddy_net:
    external: true
